name: Build Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/scripts/checked-bot-merge.py"
      - ".github/scripts/branch-heartbeat.py"
      - ".github/scripts/sync-selected-paths.sh"
      - ".github/workflow-templates/**"
      - ".github/tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/*auto-merge*.yml"
      - ".github/workflows/sync-repo-settings.yml"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test shared maintenance policies
        run: python3 -m unittest discover -s .github/tests -v
