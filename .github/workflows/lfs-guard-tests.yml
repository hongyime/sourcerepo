name: LFS guard fixtures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lfs-guard.yml'
      - '.github/workflows/lfs-guard-tests.yml'
      - 'tests/test_lfs_guard.py'
  pull_request:
    paths:
      - '.github/workflows/lfs-guard.yml'
      - '.github/workflows/lfs-guard-tests.yml'
      - 'tests/test_lfs_guard.py'

permissions:
  contents: read

concurrency:
  group: lfs-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p test_lfs_guard.py -v
