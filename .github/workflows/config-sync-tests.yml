name: Config sync preservation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-selected-paths.sh'
      - '.github/scripts/preserve-workflow-actions.py'
      - '.github/workflows/sync-repo-settings.yml'
      - 'tests/test_*.py'
      - 'tools/reconcile_repos.py'
      - '.github/workflows/repo-reconcile.yml'
      - '.github/workflows/config-sync-tests.yml'
  pull_request:
    paths:
      - '.github/scripts/sync-selected-paths.sh'
      - '.github/scripts/preserve-workflow-actions.py'
      - '.github/workflows/sync-repo-settings.yml'
      - 'tests/test_*.py'
      - 'tools/reconcile_repos.py'
      - '.github/workflows/repo-reconcile.yml'
      - '.github/workflows/config-sync-tests.yml'

permissions:
  contents: read

concurrency:
  group: config-sync-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check required tools and shell syntax
        run: |
          command -v git
          command -v jq
          bash -n .github/scripts/sync-selected-paths.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify preservation with local repository fixtures
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
