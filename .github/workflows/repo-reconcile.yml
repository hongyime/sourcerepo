name: Repo Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *" # Daily 4:30pm SGT

concurrency:
  group: repo-reconcile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Reconcile repo metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/reconcile_repos.py \
            --org-owner "$GITHUB_REPOSITORY_OWNER" \
            --write \
            --report .github/repo-reconcile-summary.md

      - name: Open or update reconciliation PR
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/reconcile-repos"
          title="chore(shell): reconcile repo metadata"

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          if [ -z "$(git status --porcelain repos.yml tiers.yml)" ]; then
            existing="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch --comment "No repo reconciliation changes remain."
            fi
            cat .github/repo-reconcile-summary.md
            exit 0
          fi

          git switch -c "$branch"
          git add repos.yml tiers.yml
          git commit -m "$title"
          git push -u origin "$branch" --force-with-lease

          existing="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file .github/repo-reconcile-summary.md
          else
            gh pr create --title "$title" --body-file .github/repo-reconcile-summary.md --base main --head "$branch"
          fi
